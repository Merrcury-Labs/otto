name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Type Check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-for-build-only
          NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3002
          NEXT_PUBLIC_WEB_URL: http://localhost:3000
          NEXT_PUBLIC_COLLAB_URL: http://localhost:1234
          NEXT_PUBLIC_COLLAB_SECRET: ci-dummy-collab-secret
